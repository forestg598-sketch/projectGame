<!doctype html>
<html lang="ko">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width,initial-scale=1" />
		<meta
			name="description"
			content="수능 과목을 카드로 돌파하는 덱빌딩 RPG"
		/>
		<title>수능의 탑</title>
		<style>
			:root {
				color-scheme: dark;
				--bg: #101012;
				--panel: #19191e;
				--line: #33333b;
				--ink: #f6f2e9;
				--muted: #abaab5;
				--gold: #f6cb74;
				--blue: #8ad6ff;
				--pink: #ff969c;
			}
			* {
				box-sizing: border-box;
			}
			body {
				margin: 0;
				background:
					radial-gradient(
						ellipse at 65% 0,
						#282231 0,
						transparent 55%
					),
					var(--bg);
				color: var(--ink);
				font:
					15px/1.5 system-ui,
					'Malgun Gothic',
					sans-serif;
				min-height: 100vh;
			}
			button {
				font: inherit;
				color: inherit;
				border: 1px solid var(--line);
				background: #25252d;
				padding: 10px 16px;
				border-radius: 8px;
				cursor: pointer;
			}
			button:hover:not(:disabled) {
				border-color: var(--gold);
				background: #33303a;
			}
			button:focus-visible {
				outline: 2px solid var(--blue);
				outline-offset: 3px;
			}
			button:disabled {
				opacity: 0.46;
				cursor: default;
			}
			.primary {
				background: var(--gold);
				color: #21190f;
				border-color: var(--gold);
				font-weight: 800;
			}
			.primary:hover:not(:disabled) {
				background: #ffe1a3;
				color: #21190f;
			}
			header {
				max-width: 1180px;
				margin: auto;
				display: flex;
				justify-content: space-between;
				align-items: center;
				padding: 19px 24px;
				border-bottom: 1px solid var(--line);
			}
			.brand {
				font-weight: 900;
				letter-spacing: -0.06em;
				font-size: 23px;
			}
			.brand em {
				font-style: normal;
				color: var(--gold);
			}
			main {
				max-width: 1180px;
				margin: auto;
				padding: 26px 24px 48px;
			}
			.eyebrow {
				font-size: 12px;
				letter-spacing: 0.19em;
				font-weight: 800;
				color: var(--gold);
			}
			h1,
			h2,
			h3,
			p {
				margin: 0;
			}
			h1 {
				font-size: clamp(40px, 8vw, 92px);
				line-height: 1.03;
				letter-spacing: -0.09em;
			}
			h2 {
				font-size: clamp(24px, 4vw, 43px);
				letter-spacing: -0.065em;
			}
			h3 {
				font-size: 20px;
				letter-spacing: -0.04em;
			}
			.muted,
			small {
				color: var(--muted);
			}
			.hero {
				min-height: 540px;
				display: grid;
				grid-template-columns: 1fr 1fr;
				gap: 24px;
				align-items: center;
				padding: 32px 0;
			}
			.hero p {
				margin: 18px 0 27px;
				color: var(--muted);
			}
			.hero .eyebrow {
				margin-bottom: 12px;
			}
			.actions,
			.row {
				display: flex;
				gap: 8px;
				flex-wrap: wrap;
				align-items: center;
			}
			.nav {
				margin-top: 12px;
			}
			.stage {
				position: relative;
				overflow: hidden;
				background:
					radial-gradient(
						ellipse at center,
						#3b2f46,
						transparent 70%
					),
					repeating-linear-gradient(
						115deg,
						transparent 0 42px,
						#ffffff0a 43px 44px
					),
					#15151d;
				border: 1px solid var(--line);
				border-radius: 14px;
				min-height: 290px;
				display: grid;
				place-items: center;
				isolation: isolate;
			}
			.hero .stage {
				height: 460px;
			}
			.stage:after {
				content: '';
				position: absolute;
				inset: auto 0 0;
				height: 30%;
				background: linear-gradient(transparent, #121217);
				z-index: -1;
			}
			.tower {
				width: 56%;
				height: 85%;
				background: linear-gradient(
					90deg,
					#16121c,
					#63516b 48%,
					#201727 50%,
					#33293c
				);
				clip-path: polygon(
					50% 0,
					66% 15%,
					66% 31%,
					77% 31%,
					77% 54%,
					88% 54%,
					88% 76%,
					100% 76%,
					100% 100%,
					0 100%,
					0 76%,
					12% 76%,
					12% 54%,
					23% 54%,
					23% 31%,
					34% 31%,
					34% 15%
				);
				display: grid;
				place-items: center;
				color: var(--gold);
				font-size: 55px;
				text-shadow: 0 0 30px var(--gold);
			}
			.panel {
				background: var(--panel);
				border: 1px solid var(--line);
				border-radius: 12px;
				padding: 18px;
			}
			.topline {
				display: flex;
				justify-content: space-between;
				align-items: center;
				gap: 12px;
				margin-bottom: 14px;
				flex-wrap: wrap;
			}
			.grid {
				display: grid;
				grid-template-columns: repeat(2, minmax(0, 1fr));
				gap: 12px;
				margin-top: 14px;
			}
			.choice {
				display: grid;
				gap: 10px;
				justify-items: start;
				min-height: 165px;
			}
			.choice.elite {
				border-color: #815f43;
			}
			.battle {
				display: grid;
				grid-template-columns: 1fr 300px;
				gap: 12px;
			}
			.enemy {
				text-align: center;
				padding: 16px;
			}
			.sigil {
				margin: auto auto 10px;
				width: 124px;
				height: 124px;
				display: grid;
				place-items: center;
				border: 1px solid currentColor;
				border-radius: 26%;
				transform: rotate(-8deg);
				font-size: 54px;
				font-weight: 900;
				color: var(--gold);
				background: #222032;
				box-shadow:
					0 0 60px #a16eb93f,
					inset 0 0 40px #bf99ff22;
			}
			.meter {
				height: 7px;
				background: #37323b;
				border-radius: 20px;
				overflow: hidden;
				margin: 8px 0 3px;
			}
			.meter i {
				display: block;
				height: 100%;
				background: var(--gold);
				transition: width 0.24s;
			}
			.stat {
				padding: 9px 0;
				border-bottom: 1px solid var(--line);
				display: flex;
				justify-content: space-between;
				gap: 8px;
			}
			.stat strong {
				color: var(--blue);
			}
			.log {
				font-size: 13px;
				color: var(--muted);
				margin-top: 12px;
				min-height: 4em;
			}
			.intent {
				color: var(--pink);
				margin-top: 5px;
				font-size: 13px;
			}
			.hand {
				display: grid;
				grid-template-columns: repeat(auto-fit, minmax(143px, 1fr));
				gap: 8px;
				margin: 10px 0;
			}
			.card {
				display: grid;
				text-align: left;
				align-content: start;
				gap: 8px;
				min-height: 142px;
				background: linear-gradient(155deg, #343241, #222229);
				padding: 12px;
				border-color: #514957;
			}
			.card b {
				color: var(--gold);
			}
			.card span {
				font-size: 13px;
			}
			.card.confuse {
				border-color: #884e65;
				background: #382631;
			}
			.card.confuse b {
				color: var(--pink);
			}
			.notice {
				margin: 12px 0;
				color: var(--gold);
				min-height: 1.5em;
			}
			.collection {
				display: grid;
				grid-template-columns: repeat(auto-fill, minmax(175px, 1fr));
				gap: 10px;
				margin: 14px 0;
			}
			.collection .panel {
				display: grid;
				gap: 6px;
			}
			.badge {
				padding: 4px 9px;
				border: 1px solid var(--line);
				border-radius: 20px;
				color: var(--muted);
				font-size: 12px;
			}
			.summary {
				max-width: 630px;
				margin: 60px auto;
			}
			.summary > * + * {
				margin-top: 12px;
			}
			label {
				display: block;
				margin: 8px 0;
			}
			input[type='checkbox'] {
				accent-color: var(--gold);
			}
			@media (max-width: 780px) {
				.hero,
				.battle {
					grid-template-columns: 1fr;
				}
				.hero .stage {
					height: 260px;
					grid-row: 1;
				}
				.hero {
					padding: 0;
					min-height: 0;
				}
				.stage {
					min-height: 235px;
				}
				.grid {
					grid-template-columns: 1fr;
				}
				main {
					padding: 16px;
				}
				header {
					padding: 12px 16px;
				}
				.hand {
					grid-template-columns: repeat(2, minmax(0, 1fr));
				}
				.card {
					min-height: 114px;
				}
			}
			@media (prefers-reduced-motion: reduce) {
				* {
					transition: none !important;
				}
			}
		</style>
	</head>
	<body>
		<header>
			<div class="brand">수능의 <em>탑</em></div>
			<button id="home" hidden>메인 화면</button>
		</header>
		<main id="app"></main>
		<script>
			'use strict';
			const cards = {
				outline: { n: '핵심 정리', c: 2, d: '풀이력 +8', solve: 8 },
				focus: { n: '집중 풀이', c: 4, d: '풀이력 +16', solve: 16 },
				scan: { n: '빠른 훑기', c: 1, d: '풀이력 +4', solve: 4 },
				breath: { n: '심호흡', c: 0, d: '혼란 2장 제거', clear: 2 },
				rhythm: { n: '페이스 조절', c: 1, d: '체력 12 회복', heal: 12 },
				note: {
					n: '오답 노트',
					c: 3,
					d: '풀이력 +10, 혼란 1장 제거',
					solve: 10,
					clear: 1,
				},
				infer: { n: '논리 추론', c: 3, d: '풀이력 +14', solve: 14 },
				eraser: { n: '지우개', c: 0, d: '혼란 3장 제거', clear: 3 },
				break: { n: '쉬는 시간', c: 2, d: '체력 25 회복', heal: 25 },
				finish: { n: '마지막 검산', c: 5, d: '풀이력 +14', solve: 14 },
			};
			const starter = [
				'outline',
				'outline',
				'focus',
				'scan',
				'scan',
				'breath',
				'rhythm',
				'note',
				'infer',
				'eraser',
			];
			const subjects = [
				{
					n: '국어',
					enemy: '뒤엉킨 문장',
					symbol: '㉠',
					patterns: [
						['문장 뒤틀기', 'confuse', 1, 8],
						['함정 선택지', 'confuse', 1],
						['시간 압박', 'hit', 13],
						['긴 지문', 'hard', 5],
					],
				},
				{
					n: '수학',
					enemy: '극한의 루트',
					symbol: '√',
					patterns: [
						['근호 전개', 'hard', 5, 9],
						['복잡한 계산', 'drain', 2],
						['분모의 반격', 'hit', 15],
						['극한 도약', 'hard', 7],
					],
				},
				{
					n: '영어',
					enemy: '미궁의 알파벳',
					symbol: 'A',
					patterns: [
						['낯선 어휘', 'tax', 1, 8],
						['빈칸 추론', 'confuse', 1],
						['장문 독해', 'drain', 2, 12],
						['문장 재배열', 'lock', 1],
					],
				},
				{
					n: '통합사회',
					enemy: '삼권분립 요새',
					symbol: '權',
					patterns: [
						['규칙 개정', 'lock', 1, 8],
						['자료 추가', 'hard', 5],
						['이해 충돌', 'hit', 14],
						['의결 보류', 'tax', 1],
					],
				},
				{
					n: '통합과학',
					enemy: '융합 실험체',
					symbol: '⚛',
					patterns: [
						['연쇄 반응', 'combo', 10],
						['실험 조건 변경', 'hard', 6],
						['궤도 이탈', 'confuse', 1, 12],
						['에너지 흡수', 'drain', 2],
					],
				},
			];
			const boss = {
				n: '최종 시험',
				enemy: '수능의 심판자',
				symbol: '塔',
				patterns: [
					['복합 지문', 'confuse', 2, 14],
					['통합 조건', 'hard', 9],
					['시간 강탈', 'drain', 3, 16],
					['교차 검증', 'tax', 2],
					['출제 범위 확장', 'lock', 2],
					['연쇄 실험', 'combo', 18],
					['마지막 킬러 문항', 'hard', 12],
					['종료 직전 경고', 'hit', 24],
				],
			};
			const effectText = {
				confuse: (n) => `혼란 ${n}장 추가`,
				hard: (n) => `난도 +${n}`,
				drain: (n) => `정신력 −${n}`,
				tax: (n) => `다음 턴 카드 비용 +${n}`,
				lock: (n) => `다음 턴 풀이 카드 최대 ${n}장`,
				combo: (n) => `체력 −${n}, 혼란 1장 추가`,
				hit: (n) => `체력 −${n}`,
			};
			const app = document.querySelector('#app');
			const storageKey = 'suneung-tower-v1';
			const defaults = {
				run: null,
				collection: [...new Set(starter)],
				savedDeck: null,
				history: [],
				settings: { confirm: true },
			};
			let data;
			try {
				data = {
					...defaults,
					...JSON.parse(localStorage.getItem(storageKey) || '{}'),
				};
			} catch {
				data = structuredClone(defaults);
			}
			let run = data.run,
				view = 'home',
				notice = '',
				storageFailed = false;
			const save = () => {
				data.run = run;
				try {
					localStorage.setItem(storageKey, JSON.stringify(data));
				} catch {
					storageFailed = true;
				}
			};
			const shuffle = (list) => {
				const copy = [...list];
				for (let i = copy.length - 1; i > 0; i--) {
					const j = Math.floor(Math.random() * (i + 1));
					[copy[i], copy[j]] = [copy[j], copy[i]];
				}
				return copy;
			};
			const button = (label, action, cls = '', disabled = false) =>
				`<button class="${cls}" data-act="${action}" ${disabled ? 'disabled' : ''}>${label}</button>`;
			const number = (x) => Number(x) || 0;
			function go(next) {
				view = next;
				notice = '';
				render();
			}
			function newRun(useSaved = false) {
				if (
					run &&
					data.settings.confirm &&
					!confirm('진행 중인 시험을 새 시험으로 바꿀까요?')
				)
					return;
				run = {
					step: 0,
					score: 0,
					hp: 100,
					deck: [
						...(useSaved && data.savedDeck
							? data.savedDeck
							: starter),
					],
					phase: 'map',
					battle: null,
					results: [],
				};
				save();
				go('run');
			}
			function enemy() {
				return run.step === 15 ? boss : subjects[run.step % 5];
			}
			function chapter() {
				return ['기초', '응용', '심화', '최종 시험'][
					Math.floor(run.step / 5)
				];
			}
			const quizModes = [
				'18초 안에 문장 따라 쓰기',
				'암산으로 계산한 답 입력',
				'영어 단어의 뜻에 맞는 번호 선택',
				'O·X 중 하나 선택',
				'생명·물리·화학·지구과학을 연결해 결론 선택',
			];
			const questionBank = [
				[
					'아는 길도 물어 가라.',
					'가는 말이 고와야 오는 말이 곱다.',
					'작은 물방울이 모여 큰 강을 이룬다.',
				],
				[],
				[
					['abundant', ['부족한', '풍부한', '조용한'], 1],
					['reluctant', ['열정적인', '정확한', '꺼리는'], 2],
					['preserve', ['보존하다', '비교하다', '거절하다'], 0],
				],
				[
					[
						'한 가지를 선택하면서 포기한 대안 중 가장 가치 있는 것이 기회비용이다.',
						['O', 'X'],
						0,
					],
					[
						'삼권분립은 입법·행정·사법 권력을 한 기관에 집중하는 제도이다.',
						['O', 'X'],
						1,
					],
					[
						'재생 가능 에너지의 발전량은 날씨와 계절에 따라 달라질 수 있다.',
						['O', 'X'],
						0,
					],
				],
				[
					[
						'햇빛을 받는 연못에서 물속 식물의 광합성이 활발해졌다. 다른 조건이 같다면 어떤 변화가 예상되는가?',
						[
							'이산화 탄소 감소, 산소 증가',
							'이산화 탄소 증가, 산소 감소',
							'두 기체 모두 감소',
						],
						0,
					],
					[
						'지진으로 바닷물이 크게 움직여 해일이 발생했다. 해일이 해안에 닿을 때 옳은 설명은?',
						[
							'해안 생태계에는 영향이 없다',
							'파동이 에너지를 전달해 해안 생물의 서식지를 바꿀 수 있다',
							'바닷물은 충돌할 때 새로운 원소로 바뀐다',
						],
						1,
					],
					[
						'대기 중 이산화 탄소가 늘어 지표의 온실 효과가 강해졌다. 이어질 수 있는 변화는?',
						[
							'지표가 방출하는 적외선을 대기가 전혀 흡수하지 않는다',
							'대기 온도가 반드시 내려간다',
							'평균 기온 상승으로 일부 생물의 분포가 달라질 수 있다',
						],
						2,
					],
				],
			];
			function currentQuiz() {
				const b = run.battle;
				if (run.step >= 15 || (b.turn - 1) % 3 !== 0) return null;
				const subject = run.step % 5,
					index = (Math.floor(run.step / 5) + (b.turn - 1) / 3) % 3;
				if (subject === 0)
					return {
						subject,
						prompt: questionBank[0][index],
						seconds: 18,
					};
				if (subject === 1) {
					const a = 12 + index * 3,
						multiplier = b.elite ? 7 : 4,
						add = 8 + index;
					return {
						subject,
						prompt: `${a} × ${multiplier} + ${add} = ?`,
						answer: a * multiplier + add,
					};
				}

					data.settings.confirm = event.target.checked;
					save();
				}
			});
			render();
		</script>
